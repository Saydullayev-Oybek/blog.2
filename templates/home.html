{% extends 'base.html' %}

{% block title %} Home Page {% endblock title %}

{% block content%}

    {% if user.is_authenticated%}
        <h1>welcome {{ user.username }}</h1>
        <a href="">log out</a>
        <a href="{% url 'password_change' %}">Change password</a>


    {% else %}
        <h3>here you can log in </h3>
        <a href="">reset password</a> |
        <a href="">log in</a> |
        <a href="">sign up</a>
    {% endif %}


{% endblock content %}
